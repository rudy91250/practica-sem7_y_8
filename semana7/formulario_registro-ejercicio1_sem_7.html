<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Estudiante</title>
</head>
<body>

    <h1>Formulario de Registro de Estudiante</h1>

    <form>

        <!-- DATOS PERSONALES -->
        <div>
            <h3>Datos Personales</h3>

            <label for="nombre">Nombres y Apellidos:</label><br>
            <input type="text" id="nombre" name="nombre"
                   placeholder="Ingrese sus nombres y apellidos"
                   minlength="3" required><br><br>

            <label for="correo">Correo Electrónico:</label><br>
            <input type="email" id="correo" name="correo"
                   placeholder="ejemplo@gmail.com"
                   required><br><br>

            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" name="password"
                   placeholder="Ingrese una contraseña"
                   minlength="8" required><br><br>

            <label for="confirmar">Confirmar Contraseña:</label><br>
            <input type="password" id="confirmar" name="confirmar"
                   placeholder="Confirme su contraseña"><br><br>

            <label for="fecha">Fecha de Nacimiento:</label><br>
            <input type="date" id="fecha" name="fecha" required><br><br>

            <label for="genero">Género:</label><br>
            <select id="genero" name="genero">
                <option value="">Seleccione</option>
                <option>Masculino</option>
                <option>Femenino</option>
                <option>Prefiero no decir</option>
            </select><br><br>
        </div>

        <!-- DATOS ACADÉMICOS -->
        <div>
            <h3>Datos Académicos</h3>

            <label for="programa">Programa de Estudios:</label><br>
            <select id="programa" name="programa" required>
                <option value="">Seleccione</option>
                <option>Desarrollo de Sistemas</option>
                <option>Contabilidad</option>
                <option>Administración</option>
            </select><br><br>

            <label for="ciclo">Ciclo:</label><br>
            <select id="ciclo" name="ciclo" required>
                <option value="">Seleccione</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
            </select><br><br>
        </div>

        <!-- DATOS DE CONTACTO -->
        <div>
            <h3>Datos de Contacto</h3>

            <label for="telefono">Teléfono:</label><br>
            <input type="tel" id="telefono" name="telefono"
                   placeholder="999999999"
                   pattern="[0-9]{9}"
                   minlength="9"><br><br>

            <input type="checkbox" id="terminos" required>
            <label for="terminos">Acepto términos y condiciones</label><br><br>
        </div>

        <button type="reset">Limpiar</button>
        <button type="submit">Registrar</button>

    </form>

</body>
</html>
